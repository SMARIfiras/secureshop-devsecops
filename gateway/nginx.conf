# ──────────────────────────────────────────────────────────────────────────────
# SecureShop — Nginx API Gateway
# Responsibilities:
#   • Single HTTPS entry point for all microservices
#   • JWT validation via auth_request sub-request
#   • Rate limiting: 100 req/min per IP
#   • Request routing to upstream services
#   • Security headers
# ──────────────────────────────────────────────────────────────────────────────

# Rate-limit zone — 100 req/min per IP  (100r/m ≈ 1.67r/s → burst=10)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

# Upstream definitions (Docker internal DNS)
upstream user_service      { server user-service:8001;      keepalive 16; }
upstream product_service   { server product-service:8002;   keepalive 16; }
upstream order_service     { server order-service:8003;     keepalive 16; }
upstream payment_service   { server payment-service:8004;   keepalive 16; }
upstream notification_svc  { server notification-service:8005; keepalive 16; }
upstream inventory_service { server inventory-service:8006; keepalive 16; }

# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Hide Nginx version (Information Disclosure mitigation)
    server_tokens off;

    # Global security headers
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"      always;
    add_header Content-Security-Policy "default-src 'none'" always;

    # Apply rate limit globally
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    # ── Health check (no auth) ───────────────────────────────────────────────
    location /health {
        return 200 '{"gateway":"ok"}';
        add_header Content-Type application/json;
    }

    # ── User Service (public endpoints: register, login) ─────────────────────
    location /api/users/register {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass         http://user_service/register;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/users/login {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass         http://user_service/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── User Service (protected endpoints) ───────────────────────────────────
    location /api/users/ {
        proxy_pass         http://user_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Product Service (GET public, POST/PUT/DELETE require auth) ───────────
    location /api/products/ {
        proxy_pass         http://product_service/products/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Order Service (requires JWT) ─────────────────────────────────────────
    location /api/orders/ {
        proxy_pass         http://order_service/orders/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Payment Service (requires JWT) ───────────────────────────────────────
    location /api/payments/ {
        proxy_pass         http://payment_service/payments/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Notification Service (internal; not exposed to public) ───────────────
    location /api/notifications/ {
        # Restrict to internal Docker subnet only
        allow  172.0.0.0/8;
        deny   all;
        proxy_pass         http://notification_svc/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── Inventory Service (read-only public, writes internal) ────────────────
    location /api/inventory/ {
        proxy_pass         http://inventory_service/inventory/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Block all other paths ─────────────────────────────────────────────────
    location / {
        return 404 '{"detail":"Not found"}';
        add_header Content-Type application/json;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"detail":"Rate limit exceeded. Try again later."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"detail":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
