name: "SCA — Software Composition Analysis"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run daily at 02:00 UTC to catch newly published CVEs
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  # ── OWASP Dependency-Check ───────────────────────────────────────────────────
  dependency-check:
    name: "OWASP Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "SecureShop"
          path: "."
          format: "SARIF"
          out: "reports/dependency-check"
          args: >-
            --enableRetired
            --failOnCVSS 9
            --suppression suppression.xml
        continue-on-error: true   # Upload report even if findings exist

      - name: Upload Dependency-Check SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-html
          path: reports/dependency-check/dependency-check-report.html
          retention-days: 14

  # ── Trivy filesystem scan ────────────────────────────────────────────────────
  trivy-fs:
    name: "Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy on repository filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"   # Don't fail here; let SARIF upload first

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL"
          exit-code: "1"
          format: "table"
