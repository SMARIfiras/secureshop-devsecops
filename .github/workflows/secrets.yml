name: "Secrets Detection"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  # ── Gitleaks ─────────────────────────────────────────────────────────────────
  gitleaks:
    name: "Gitleaks — Git History Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full git history required for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Needed for org-level scans

      - name: Generate SARIF report
        if: failure()
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/gitleaks-results.sarif \
            --exit-code 0

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  # ── TruffleHog ───────────────────────────────────────────────────────────────
  trufflehog:
    name: "TruffleHog — Entropy + Pattern Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --debug
            --only-verified
            --json
        continue-on-error: true

      - name: TruffleHog full scan (unverified secrets)
        run: |
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json \
            --no-update \
            2>/dev/null | tee trufflehog-results.json | \
            python3 -c "
          import sys, json
          findings = [json.loads(l) for l in sys.stdin if l.strip()]
          print(f'TruffleHog found {len(findings)} potential secret(s)')
          if findings:
              for f in findings[:5]:
                  print(f'  [{f.get(\"DetectorName\",\"?\")}] {f.get(\"Raw\",\"\")[:60]}...')
          " || true

      - name: Upload TruffleHog results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 14
